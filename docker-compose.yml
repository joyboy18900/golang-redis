services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app1:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      APP_PORT: 8080
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      LOCK_TTL_SECONDS: 10
      RATE_LIMIT_LIMIT: 5
      RATE_LIMIT_WINDOW_SECONDS: 10
      PUBSUB_CHANNEL: notifications
      PUBSUB_CONSUMER_COUNT: 2
    ports:
      - "8080:8080"

  app2:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      APP_PORT: 8080
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      LOCK_TTL_SECONDS: 10
      RATE_LIMIT_LIMIT: 5
      RATE_LIMIT_WINDOW_SECONDS: 10
      PUBSUB_CHANNEL: notifications
      PUBSUB_CONSUMER_COUNT: 2
    ports:
      - "8081:8080"
